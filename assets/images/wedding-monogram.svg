<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="warmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5db"/>
      <stop offset="35%" stop-color="#f0d38d"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9e7b23"/>
    </linearGradient>
    <radialGradient id="maroonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#540e1b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#220508" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="250" cy="250" r="230" fill="url(#maroonGlow)"/>

  <!-- Elegant Delicate Double Rings -->
  <circle cx="250" cy="250" r="200" stroke="url(#warmGold)" stroke-width="1.2" fill="none" opacity="0.4"/>
  <circle cx="250" cy="250" r="192" stroke="url(#warmGold)" stroke-width="1.8" fill="none" opacity="0.75"/>
  <circle cx="250" cy="250" r="185" stroke="url(#warmGold)" stroke-width="1" stroke-dasharray="3,5" fill="none" opacity="0.45"/>

  <!-- Soft Friendly Botanical Leaf Wreaths (Olive / Eucalyptus sprigs) -->
  <g stroke="url(#warmGold)" fill="url(#warmGold)" opacity="0.85">
    <!-- Left Branch Leaves -->
    <path d="M 95 240 Q 90 200 115 160 Q 110 185 125 195 Q 100 215 110 240 Z" opacity="0.6"/>
    <path d="M 85 280 Q 80 240 105 205 Q 100 225 118 235 Q 95 260 102 285 Z" opacity="0.7"/>
    <path d="M 105 325 Q 98 290 125 260 Q 120 280 138 288 Q 115 315 125 335 Z" opacity="0.6"/>
    <path d="M 135 365 Q 125 335 155 310 Q 150 330 168 335 Q 145 360 155 375 Z" opacity="0.7"/>

    <!-- Right Branch Leaves -->
    <path d="M 405 240 Q 410 200 385 160 Q 390 185 375 195 Q 400 215 390 240 Z" opacity="0.6"/>
    <path d="M 415 280 Q 420 240 395 205 Q 400 225 382 235 Q 405 260 398 285 Z" opacity="0.7"/>
    <path d="M 395 325 Q 402 290 375 260 Q 380 280 362 288 Q 385 315 375 335 Z" opacity="0.6"/>
    <path d="M 365 365 Q 375 335 345 310 Q 350 330 332 335 Q 355 360 345 375 Z" opacity="0.7"/>

    <!-- Small Delicate Floral Buds at Top and Bottom -->
    <circle cx="250" cy="52" r="3.5" fill="url(#warmGold)"/>
    <circle cx="240" cy="56" r="2" fill="url(#warmGold)"/>
    <circle cx="260" cy="56" r="2" fill="url(#warmGold)"/>

    <circle cx="250" cy="448" r="3.5" fill="url(#warmGold)"/>
    <circle cx="240" cy="444" r="2" fill="url(#warmGold)"/>
    <circle cx="260" cy="444" r="2" fill="url(#warmGold)"/>
  </g>

  <!-- Friendly Romantic Central Monogram S & F -->
  <!-- Letter S -->
  <text x="200" y="285" 
        font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" 
        font-size="130" 
        font-weight="600" 
        font-style="italic"
        fill="url(#warmGold)" 
        text-anchor="middle">S</text>

  <!-- Friendly Script Ampersand in between -->
  <text x="250" y="270" 
        font-family="'Alex Brush', cursive" 
        font-size="80" 
        fill="url(#warmGold)" 
        opacity="0.9"
        text-anchor="middle">&amp;</text>

  <!-- Letter F -->
  <text x="305" y="285" 
        font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" 
        font-size="130" 
        font-weight="600" 
        font-style="italic"
        fill="url(#warmGold)" 
        text-anchor="middle">F</text>

  <!-- Warm Subtitle ribbon -->
  <text x="250" y="340" 
        font-family="'Cinzel', sans-serif" 
        font-size="13" 
        font-weight="600" 
        letter-spacing="5" 
        fill="#f3e4be" 
        text-anchor="middle">SANRO &amp; FITRA</text>

  <text x="250" y="365" 
        font-family="'Cormorant Garamond', Georgia, serif" 
        font-size="14" 
        font-style="italic" 
        letter-spacing="2" 
        fill="url(#warmGold)" 
        text-anchor="middle">21 &bull; 10 &bull; 2026</text>
</svg>